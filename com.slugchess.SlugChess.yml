app-id: com.slugchess.SlugChess
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: 'slugchess-run.sh'
sdk-extensions: 
  - org.freedesktop.Sdk.Extension.dotnet10
build-options: 
  append-path: '/usr/lib/sdk/dotnet10/bin'
  append-ld-library-path: '/usr/lib/sdk/dotnet10/lib'
  prepend-pkg-config-path: "/usr/lib/sdk/dotnet10/lib/pkgconfig"
  env: 
    DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  arch:
    aarch64:
      env:
        RUNTIME: linux-arm64
    x86_64: 
      env: 
        RUNTIME: linux-x64
finish-args:
  # X11
  - --socket=x11
  - --share=ipc
  # Wayland access
  #- --socket=wayland
  # Needs to talk to the network:
  - --share=network
  # Sound access
  - --socket=pulseaudio
  # GPU accesaleration
  - --device=dri
modules:
  - name: slugchess
    buildsystem: simple
    build-commands:
      - 'mkdir -p /app/bin'
      - 'dotnet publish -c Release -r $RUNTIME --source nuget-sources --no-self-contained -p:PublishSingleFile=false   SlugChess/SlugChess.csproj'
      - 'cp -r --remove-destination SlugChess/bin/Release/net10.0/$RUNTIME/publish/* /app/bin/'
      - 'install -Dm755 flatpak/slugchess-run.sh -t /app/bin/'
      # add icon
      - 'install -Dm 644 SlugChess/Assets/images/svg/sc-black.svg /app/share/icons/hicolor/scalable/apps/com.slugchess.SlugChess.svg'
      # add .desktop
      - 'install -Dm 644 -t /app/share/applications flatpak/com.slugchess.SlugChess.desktop'
      # add manifest
      - 'install -Dm 644 -t /app/share/metainfo flatpak/com.slugchess.SlugChess.metainfo.xml'
      - 'install.sh'
    sources: 
      - type: git
        url: 'https://gitlab.com/slugchess/slugchess.git'
        tag: 'v1.0.2'
        commit: 'f085cc90a0e40a56f7fa35b569bfa867db64f25d'
      - nuget-sources.json

